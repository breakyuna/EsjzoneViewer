name: Feature Request
description: 提出功能建议
title: "[Feature] "
body:
  - type: textarea
    id: request
    attributes:
      label: 需求描述
      description: 希望新增或改进什么功能？
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 在什么情况下需要这个功能？
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 希望应用如何响应或展示？请勿包含账户凭据等敏感信息。
    validations:
      required: true
