name: Android Device Validation

on:
  # Device tests are deliberately opt-in: they need an emulator and are not part
  # of the signed-release path that runs for every beta push.
  workflow_dispatch:
    inputs:
      generate_baseline_profile:
        description: Generate and publish the baseline profile artifact
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g

jobs:
  connected-tests:
    name: Connected instrumentation tests
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install compile SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Grant Gradle permission
        run: chmod +x ./gradlew

      # The emulator action requires KVM permissions on GitHub-hosted Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-test-reports-${{ github.run_id }}
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 14

  macrobenchmark:
    name: Macrobenchmark smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install compile SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Grant Gradle permission
        run: chmod +x ./gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run startup macrobenchmark
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: ./gradlew :macrobenchmark:connectedCheck --stacktrace

      - name: Upload macrobenchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macrobenchmark-reports-${{ github.run_id }}
          path: |
            macrobenchmark/build/outputs/
            macrobenchmark/build/reports/
          if-no-files-found: warn
          retention-days: 14

  baseline-profile:
    name: Generate baseline profile
    if: ${{ inputs.generate_baseline_profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install compile SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Grant Gradle permission
        run: chmod +x ./gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generate baseline profile
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: ./gradlew :baselineprofile:generateBaselineProfile --stacktrace

      - name: Upload baseline profile outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-profile-${{ github.run_id }}
          path: |
            app/src/main/generated/baselineProfiles/
            baselineprofile/build/outputs/
            baselineprofile/build/reports/
          if-no-files-found: warn
          retention-days: 14
