name: Draft Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (for example v0.2.5)'
        required: true
        type: string

permissions:
  contents: read

env:
  COMMIT_ID: ${{ github.sha }}
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

concurrency:
  group: draft-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  static-contracts:
    name: Static contracts and hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4

      - name: Verify source and resource contracts
        run: python3 tools/qa/verify_static_contracts.py

      - name: Check patch whitespace
        run: git diff --check

  validate-version:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4

      - name: Check tag and Android version
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          def property_value(name):
              matches = re.findall(rf"^{name}\s*=\s*(.*?)\s*$", Path("gradle.properties").read_text(), re.MULTILINE)
              if len(matches) != 1:
                  raise SystemExit(f"Expected exactly one {name} in gradle.properties")
              return matches[0]

          version = property_value("app_version")
          code = property_value("app_version_index")
          if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version):
              raise SystemExit("app_version must be a numeric major.minor.patch version without v")
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit("Tag must exactly match v + app_version; release stopped")
          if not re.fullmatch(r"[1-9][0-9]*", code) or int(code) > 2100000000:
              raise SystemExit("app_version_index must be a positive Android versionCode")
          print(f"Validated v{version}, versionCode={code}")

  unit-tests:
    name: JVM unit tests
    needs: [validate-version, static-contracts]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 37 platform
        run: sdkmanager "platforms;android-37.0"

      - name: Grant Gradle permission
        run: chmod +x ./gradlew

      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest

  lint:
    name: Android lint
    needs: unit-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 37 platform
        run: sdkmanager "platforms;android-37.0"

      - name: Grant Gradle permission
        run: chmod +x ./gradlew

      - name: Run Android lint
        run: ./gradlew lintDebug

  build:
    name: Build signed APK and create draft
    permissions:
      contents: write
    needs: [unit-tests, lint]
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 配置 JDK 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Gradle 缓存
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 5. 安装项目需要的 Android 37 platform 与 AGP 默认 Build Tools
      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      # 7. Gradle Wrapper 权限
      - name: Grant Gradle permission
        run: chmod +x ./gradlew

      # 8. 构建 Release APK
      - name: Build release APK
        run: ./gradlew assembleRelease

      # 9. 从 GitHub Secret 恢复你的 JKS
      - name: Restore signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          umask 077
          printf '%s' "$SIGNING_KEY" | base64 --decode \
            > "$RUNNER_TEMP/esjzoneviewer.jks"

      # 10. Zipalign + 使用你的永久 Key 签名
      - name: Sign APK
        env:
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="$RUNNER_TEMP/app-release-aligned.apk"
          SIGNED_APK="$RUNNER_TEMP/app-release-signed.apk"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/37.0.0"

          "$BUILD_TOOLS/zipalign" \
            -f \
            -p \
            4 \
            "$UNSIGNED_APK" \
            "$ALIGNED_APK"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/esjzoneviewer.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            --print-certs \
            "$SIGNED_APK"

          mkdir -p outputs

          cp "$SIGNED_APK" "outputs/EsjzoneViewer-${RELEASE_TAG}.apk"

      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/esjzoneviewer.jks"

      - name: Generate SHA-256 checksum
        working-directory: outputs
        shell: bash
        run: sha256sum "EsjzoneViewer-${RELEASE_TAG}.apk" > SHA256SUMS.txt

      - name: Create or verify tag for manual release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ref_path="repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}"
          if gh api "$ref_path" > /dev/null 2>&1; then
            tagged_commit="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha)"
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag already exists on another commit; refusing to move it."
              exit 1
            fi
            echo "Existing tag points to the selected commit."
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/${RELEASE_TAG}" -f "sha=${GITHUB_SHA}" > /dev/null
            echo "Created release tag for the selected commit."
          fi

      - name: Create draft release with verified APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          # --verify-tag prevents accidental tag creation. Existing releases are never overwritten.
          gh release create "$RELEASE_TAG" \
            "outputs/EsjzoneViewer-${RELEASE_TAG}.apk" \
            outputs/SHA256SUMS.txt \
            --verify-tag \
            --draft \
            --title "EsjzoneViewer ${RELEASE_TAG}" \
            --generate-notes
