name: Android Build

on:
  # 推送到 master 时自动构建
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  # GitHub Actions 页面允许手动运行
  workflow_dispatch:

permissions:
  contents: read

env:
  COMMIT_ID: ${{ github.sha }}

jobs:
  unit-tests:
    name: JVM unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 34 platform
        run: sdkmanager "platforms;android-34"

      - name: Grant Gradle permission
        run: chmod +x ./gradlew

      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest

  lint:
    name: Android lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 34 platform
        run: sdkmanager "platforms;android-34"

      - name: Grant Gradle permission
        run: chmod +x ./gradlew

      - name: Run Android lint
        run: ./gradlew lintDebug

  build:
    name: Build signed APK
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    needs: [unit-tests, lint]
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 配置 JDK 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Gradle 缓存
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. 安装项目需要的 Android 34 Build Tools
      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      # 6. 设置版本信息
      - name: Set build metadata
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "BUILD_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "BUILD_VERSION=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      # 7. Gradle Wrapper 权限
      - name: Grant Gradle permission
        run: chmod +x ./gradlew

      # 8. 构建 Release APK
      - name: Build release APK
        run: ./gradlew assembleRelease

      # 9. 从 GitHub Secret 恢复你的 JKS
      - name: Restore signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          printf '%s' "$SIGNING_KEY" | base64 --decode \
            > "$RUNNER_TEMP/esjzoneviewer.jks"

      # 10. Zipalign + 使用你的永久 Key 签名
      - name: Sign APK
        env:
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="$RUNNER_TEMP/app-release-aligned.apk"
          SIGNED_APK="$RUNNER_TEMP/app-release-signed.apk"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"

          "$BUILD_TOOLS/zipalign" \
            -f \
            -p \
            4 \
            "$UNSIGNED_APK" \
            "$ALIGNED_APK"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/esjzoneviewer.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            --print-certs \
            "$SIGNED_APK"

          mkdir -p outputs

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            cp "$SIGNED_APK" \
              "outputs/EsjzoneViewer-${GITHUB_REF_NAME}.apk"
          else
            cp "$SIGNED_APK" \
              "outputs/EsjzoneViewer-${GITHUB_SHA::7}.apk"
          fi

      # 11. 上传 APK 到 Actions Artifacts
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: EsjzoneViewer-${{ github.sha }}
          path: outputs/*.apk
          if-no-files-found: error
          retention-days: 14
