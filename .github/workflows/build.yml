name: Android Build

on:
  push:
    branches:
      - master
      - beta
    # 只有本次推送的所有改动都属于文档/模板时才跳过构建。
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'NETWORK/**'
      - 'screenshots/docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/*.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  COMMIT_ID: ${{ github.sha }}

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Static contracts, JVM tests and lint
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source and resource contracts
        run: python3 tools/qa/verify_static_contracts.py

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # GitHub's Android runner already exposes ANDROID_HOME and sdkmanager.
      # Install only the compile platform instead of reinstalling command-line tools.
      - name: Ensure Android 37 platform
        shell: bash
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"'

      - name: Grant Gradle permission
        run: chmod +x ./gradlew

      # One invocation shares the daemon and Debug compilation between tests and lint.
      - name: Run JVM unit tests and Android lint
        run: ./gradlew testDebugUnitTest lintDebug --build-cache --parallel

  release-build:
    name: Build complete release APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android release SDK
        shell: bash
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-37.0"
          "build-tools;37.0.0"

      - name: Grant Gradle permission
        run: chmod +x ./gradlew

      # Keep the complete release pipeline, including R8, resource shrinking,
      # release vital lint and baseline-profile integration.
      - name: Build release APK
        run: ./gradlew assembleRelease --build-cache --parallel

      - name: Stage unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-release-${{ github.run_id }}
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  sign-and-publish:
    name: Sign and publish verified APK
    needs: [quality, release-build]
    runs-on: ubuntu-24.04

    steps:
      - name: Download unsigned release APK
        uses: actions/download-artifact@v4
        with:
          name: unsigned-release-${{ github.run_id }}
          path: unsigned

      - name: Ensure Android signing tools
        shell: bash
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;37.0.0"'

      - name: Restore signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          umask 077
          printf '%s' "$SIGNING_KEY" | base64 --decode \
            > "$RUNNER_TEMP/esjzoneviewer.jks"

      - name: Align, sign and verify APK
        env:
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          UNSIGNED_APK="unsigned/app-release-unsigned.apk"
          ALIGNED_APK="$RUNNER_TEMP/app-release-aligned.apk"
          SIGNED_APK="outputs/EsjzoneViewer-${GITHUB_SHA::7}.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/37.0.0"

          mkdir -p outputs

          "$BUILD_TOOLS/zipalign" \
            -f \
            -p \
            4 \
            "$UNSIGNED_APK" \
            "$ALIGNED_APK"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/esjzoneviewer.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            --print-certs \
            "$SIGNED_APK"

      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/esjzoneviewer.jks"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: EsjzoneViewer-${{ github.sha }}
          path: outputs/*.apk
          if-no-files-found: error
          retention-days: 14
